server.port=8081

# Lee MONGODB_URI y JWT_SECRET desde el archivo .env (no se sube a GitHub).
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}

# El access token dura poco; el refresh token permite renovarlo sin volver a iniciar sesión.
jwt.secret=${JWT_SECRET}
jwt.access-minutos=15
jwt.refresh-dias=7

# Los errores se responden en formato ProblemDetail (RFC 9457).
spring.mvc.problemdetails.enabled=true
